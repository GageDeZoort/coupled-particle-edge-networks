[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cpen"
version = "0.1.0"
description = "Coupled particle-edge networks for jet physics hyperparameter transfer"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "lightning>=2.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "jetnet>=0.2.0",
    "tables>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ipykernel>=6.0",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
