[metadata]
name = cpen
version = 0.1.0
description = Coupled particle-edge networks for jet physics hyperparameter transfer
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    torch>=2.0
    lightning>=2.0
    pandas>=2.0
    pyarrow>=14.0
    numpy>=1.24
    scikit-learn>=1.3
    jetnet>=0.2.0
    tables>=3.8

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=7.0
    ipykernel>=6.0
    matplotlib>=3.7
